services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Missing RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Missing RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12

  voicevideo-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: voicevideo-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - voicevideo-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  voicevideo-api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: voicevideo-service
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMQ: "host=rabbitmq;username=${RABBITMQ_USER};password=${RABBITMQ_PASSWORD}"
      ConnectionStrings__VoiceVideoDb: "Server=voicevideo-db,1433;Database=VoiceVideoDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
    depends_on:
      rabbitmq:
        condition: service_healthy
      voicevideo-db:
        condition: service_healthy

volumes:
  voicevideo-sql-data:
